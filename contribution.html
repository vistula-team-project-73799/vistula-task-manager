<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Contribution</title>
</head>
<body>
    <h1>Team Contribution</h1>

    <button id="load-contributor">Show Contributor</button>
    <p id="contributor-student-id"></p>

    <br><br>
    <a href="index.html">Back to Task Manager</a>

    <script>
        document.getElementById('load-contributor').addEventListener('click', async () => {
            try {
                const response = await fetch('contribution.json');
                const data = await response.json();
                document.getElementById('contributor-student-id').innerText = `Contributor Student ID: ${data.contributorStudentId}`;
            } catch (error) {
                console.error('Error fetching JSON:', error);
                document.getElementById('contributor-student-id').innerText = 'Error loading contributor ID.';
            }
        });
    </script>
</body>
</html>
